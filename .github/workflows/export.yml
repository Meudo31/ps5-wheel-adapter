name: Export binaires
on:
  push:
    branches: [export-binaires]
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 42621599022
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out
          merge-multiple: true
      - run: |
          mkdir -p binaires
          mv out/adapter.uf2 binaires/adapter.uf2
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -f binaires
          git commit -m "Binaires du build 42621599022" || true
          git push
